{% extends "base.html" %}
{% block title %}奶龙工业大学网课平台 - 登录{% endblock %}
{% block content %}
<div class="auth-box">
    <h1>奶龙工业大学网课平台</h1>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <div class="tabs">
        <button class="tab active" onclick="switchTab(event,'login')">登录</button>
        <button class="tab" onclick="switchTab(event,'register')">注册</button>
    </div>
    <form id="login-form" class="auth-form" method="post" action="/login">
        <input type="text" name="username" placeholder="用户名" required autofocus>
        <input type="password" name="password" placeholder="密码" required>
        <button type="submit" class="btn-primary">登录</button>
    </form>
    <form id="register-form" class="auth-form hidden" method="post" action="/register">
        <input type="text" name="username" placeholder="用户名" required>
        <input type="password" name="password" placeholder="密码（至少 6 位）" required>
        <button type="submit" class="btn-primary">注册</button>
    </form>
</div>
<script>
function switchTab(e, tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
}
</script>
{% endblock %}
